name: Build Windows exe + macOS app
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия релиза, например v1.0.0 (пусто = только сборка без релиза)'
        required: false
        default: ''
  push:
    tags: ['v*']
permissions:
  contents: write          # needed to create a GitHub Release
jobs:
  build:
    # Python 3.8 is the last version that runs on Windows 7; numpy 1.x (not 2.x) runs on CPUs without SSE4.2/POPCNT
    runs-on: windows-2022
    strategy:
      matrix:
        arch: [x64, x86]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          architecture: ${{ matrix.arch }}
      - run: pip install "numpy==1.24.4" "sounddevice==0.4.6" "pyserial>=3.5" "pyinstaller==5.13.2"
      # one-folder build: nothing is extracted to %TEMP% at start-up (avoids "Failed to extract ... dll")
      - run: pyinstaller --noconfirm --onedir --windowed --name HFPagerApp --collect-all sounddevice --hidden-import hfpager_modem --hidden-import hfpager_rx --hidden-import hfpager_ptt --hidden-import hfpager_rig --hidden-import serial.tools.list_ports hfpager_app.py
      - run: Compress-Archive -Path dist\HFPagerApp -DestinationPath HFPagerApp-windows-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: HFPagerApp-windows-${{ matrix.arch }}
          path: HFPagerApp-windows-${{ matrix.arch }}.zip

  build-macos:
    # PyInstaller .app bundle (ad-hoc signed, not notarized); Apple Silicon and Intel are separate builds
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.arch == 'x64' }}      # the Intel runner must not block the release
    strategy:
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-15-intel
            arch: x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m PyInstaller --noconfirm hfpager_mac.spec
      - run: codesign --force --deep --sign - dist/HFPagerApp.app
      - run: ditto -c -k --sequesterRsrc --keepParent dist/HFPagerApp.app HFPagerApp-macos-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: HFPagerApp-macos-${{ matrix.arch }}
          path: HFPagerApp-macos-${{ matrix.arch }}.zip

  release:
    # runs for a pushed tag v* or for a manual run with a version filled in
    needs: [build, build-macos]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: HFPagerApp-*
          merge-multiple: true
          path: dist
      - name: Source archive
        run: zip -qr dist/HFPagerApp-source.zip . -x ".git/*" -x "dist/*"
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          cat > notes.md <<'NOTES'
          **HFPagerApp** — HFPager-совместимый пейджер (PS-18: 1.46 / 5.86 / 23.44 / 46.88 Бод), приём и передача через звуковую карту, CAT/PTT (ICOM, YAESU, KENWOOD), сценарии, отложенные сообщения.

          - `HFPagerApp-windows-x64.zip` — Windows 7/8/10/11, 64 бита
          - `HFPagerApp-windows-x86.zip` — Windows 7/8/10/11, 32 бита
          - `HFPagerApp-macos-arm64.zip` — macOS на Apple Silicon (M1 и новее); `HFPagerApp-macos-x64.zip` — Mac с процессором Intel
          - `HFPagerApp-source.zip` — исходный код (Python 3.8+, `pip install -r requirements.txt`)

          Распакуйте архив целиком и запустите `HFPagerApp.exe`. На Windows 7 нужны SP1 и обновление KB2999226 (Universal C Runtime). Mac: распакуйте, перенесите `HFPagerApp.app` в «Программы», первый запуск — правый клик → «Открыть» (приложение без сертификата разработчика); разрешите доступ к микрофону. Подробнее — `README_APP.md`, `README_MAC.md`.
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber
          else
            gh release create "$TAG" dist/*.zip --title "HFPagerApp $TAG" --notes-file notes.md --generate-notes --target "$GITHUB_SHA"
          fi
