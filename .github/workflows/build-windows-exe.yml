name: Build Windows exe
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy sounddevice pyinstaller
      - run: pyinstaller --noconfirm --onefile --windowed --name HFPagerApp --collect-all sounddevice --hidden-import hfpager_modem --hidden-import hfpager_rx hfpager_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: HFPagerApp-windows
          path: dist/HFPagerApp.exe
